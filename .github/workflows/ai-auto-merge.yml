name: AI Auto Merge (Squash)

on:
  workflow_run:
    workflows: ["PR"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  # --- RK9 Custom (RK9-350) --- read riittää ajolistaukseen; write tarvittiin vain deploy-dev-dispatchiin.
  actions: read

concurrency:
  group: ai-auto-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Auto-merge PR when CI is green
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null
    # --- RK9 Custom (RK9-350) --- runner-vipu, ks. doc/CI-RUNNER.md
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["ubuntu-latest"]') }}
    steps:
      - name: Decide and merge (squash)
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const wr = context.payload.workflow_run;
            const prRef = wr.pull_requests?.[0];
            if (!prRef?.number) {
              core.info('No PR attached to workflow_run; skip.');
              return;
            }

            const prNumber = prRef.number;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });

            if (pr.state !== 'open' || pr.draft) {
              core.info(`PR #${prNumber} not mergeable (state=${pr.state}, draft=${pr.draft}).`);
              return;
            }

            if (pr.base.ref !== 'master') {
              core.info(`PR #${prNumber} base is ${pr.base.ref}, not master -> skip.`);
              return;
            }

            // CONTRIBUTING.md requires a 5/5 Greptile score with all comments addressed
            // before merge. Auto-merge must not bypass that gate; require an explicit
            // human-applied label so this workflow can never silently merge a PR that
            // hasn't been reviewed (or worse, where Greptile flagged P1/P2 findings).
            const REQUIRED_LABEL = 'ai-auto-merge';
            const labels = (pr.labels || []).map(l => l.name);
            if (!labels.includes(REQUIRED_LABEL)) {
              core.info(`PR #${prNumber} missing '${REQUIRED_LABEL}' label -> skip auto-merge. Apply the label after Greptile 5/5 + review to opt this PR in.`);
              return;
            }

            const headBranch = pr.head.ref;
            const runsResp = await github.rest.actions.listWorkflowRunsForRepo({
              owner, repo, branch: headBranch, event: 'pull_request', per_page: 50,
            });

            const required = new Set(['PR']);
            const latestByName = new Map();
            for (const run of runsResp.data.workflow_runs) {
              if (!required.has(run.name)) continue;
              if (run.status !== 'completed') continue;
              if (run.head_sha !== pr.head.sha) continue;
              if (!latestByName.has(run.name)) latestByName.set(run.name, run);
              if (latestByName.size === required.size) break;
            }

            for (const name of required) {
              if (!latestByName.has(name)) {
                core.info(`Missing completed run for '${name}' on current PR head -> skip.`);
                return;
              }
            }

            const failed = [...latestByName.values()].find((r) => r.conclusion !== 'success');
            if (failed) {
              core.info(`Not merging: ${failed.name} conclusion=${failed.conclusion}`);
              return;
            }

            // --- RK9 Custom (RK9-470) --- polkuporras (RK9-403-malli rk9-ai-repoista).
            // Toimitusketjun polut eivät koskaan mergeydy automaattisesti, vaan ihminen
            // mergeää ne. workflow_run ajaa aina masterin version tästä tiedostosta, joten
            // PR ei voi muuttaa omaa porttiaan. Lukkotiedostoon rajattu nosto menee myös
            // ihmiselle; operaattorisessiolla on pysyvä lupa mergetä se käsin.
            const protectedPatterns = [
              // Koko .github/: workflowt, skriptit, CODEOWNERS ja tämä portti.
              /^\.github\//,
              // Drizzle-migraatiot (packages/db/drizzle.config.ts: out ./src/migrations)
              // ja muut migrations/-hakemistot missä tahansa.
              /^packages\/db\/src\/migrations\//,
              /(^|\/)migrations\//,
              /^paperclip-service\//,
              // Juuren Dockerfile ja docker/**/Dockerfile.*.
              /(^|\/)Dockerfile[^/]*$/,
              // Lukkotiedostot: CI asentaa lukosta, joten riippuvuuspuun muutos on täällä.
              /(^|\/)pnpm-lock\.yaml$/,
              /(^|\/)package-lock\.json$/,
              /(^|\/)yarn\.lock$/,
              /(^|\/)Cargo\.lock$/,
            ];
            const lockfilePattern = /(^|\/)(pnpm-lock\.yaml|package-lock\.json|yarn\.lock|Cargo\.lock)$/;
            const isProtected = (n) => protectedPatterns.some((re) => re.test(n));

            const prFiles = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: prNumber, per_page: 100,
            });
            const touched = new Set();
            for (const f of prFiles) {
              touched.add(f.filename);
              if (f.previous_filename) touched.add(f.previous_filename);
            }
            const protectedFiles = [...touched].filter(isProtected).sort();
            // Fail closed: jos koko tiedostolistaa ei nähdä (listFiles palauttaa enintään
            // 3000 tiedostoa), PR menee ihmiselle.
            const incomplete = prFiles.length !== pr.changed_files;
            if (protectedFiles.length > 0 || incomplete) {
              const lockfileOnly = !incomplete && touched.size > 0 && [...touched].every((n) => lockfilePattern.test(n));
              const reasons = [];
              if (incomplete) reasons.push(`Tiedostolista ei ole täydellinen (${pr.changed_files} tiedostoa, nähtiin ${prFiles.length}).`);
              if (protectedFiles.length > 0) reasons.push(`Suojatut polut: ${protectedFiles.map((n) => `\`${n}\``).join(', ')}`);
              core.notice(`PR #${prNumber} needs a human merge (RK9-470): ${reasons.join(' ')}`);

              const marker = `<!-- ai-auto-merge:human:${pr.head.sha} -->`;
              try {
                const comments = await github.paginate(github.rest.issues.listComments, {
                  owner, repo, issue_number: prNumber, per_page: 100,
                });
                const alreadyPosted = comments.some((c) => c.user?.login === 'github-actions[bot]' && c.body?.includes(marker));
                if (!alreadyPosted) {
                  const body = [
                    marker,
                    '**Auto-merge pysäytetty: PR koskee suojattuja polkuja, joten ihminen mergeää sen (RK9-470).**',
                    '',
                    ...reasons.map((r) => `- ${r}`),
                    '',
                    lockfileOnly
                      ? 'PR muuttaa vain lukkotiedostoa. Operaattorisessio saa mergetä sen käsin, kun CI on vihreä ja audit on ajettu (pysyvä lupa).'
                      : 'Katselmoi muutos ja mergeä käsin.',
                    '',
                    `Head: \`${pr.head.sha}\``,
                  ].join('\n');
                  await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
                }
              } catch (err) {
                core.warning(`Could not post the human-merge comment: ${err.message}`);
              }
              return;
            }

            try {
              const result = await github.rest.pulls.merge({
                owner, repo, pull_number: prNumber, merge_method: 'squash',
                // --- RK9 Custom (RK9-470) --- merge vain tarkastettu head: myöhempi push
                // (esim. .github/-muutos) ei pääse mergeen ohi polkuportin.
                sha: pr.head.sha,
                commit_title: `Auto-merge PR #${prNumber} (CI green + AI pipeline)`,
              });
              core.info(`Merged PR #${prNumber}: ${result.data.sha}`);
              // --- RK9 Custom (RK9-350) --- deploy-dev.yml poistettiin: Paperclip deployataan
              // käsin (ks. CONSTITUTION.md, "Tuotanto tällä koneella"), joten dispatchia ei ole.
            } catch (err) {
              core.setFailed(`Merge failed for PR #${prNumber}: ${err.message}`);
            }
